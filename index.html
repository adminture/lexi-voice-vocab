<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lexi – Voice Vocabulary Coach</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#3b5bdb;--ok:#2b8a3e;--no:#c92a2a;--bd:#e3e1da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16161a;--card:#202026;--tx:#eee;--mu:#9a9aa3;--ac:#748ffc;--ok:#69db7c;--no:#ff8787;--bd:#33333b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16161a;--card:#202026;--tx:#eee;--mu:#9a9aa3;--ac:#748ffc;--ok:#69db7c;--no:#ff8787;--bd:#33333b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0}p.sub{color:var(--mu);margin:.2rem 0 1rem;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.stats{display:flex;gap:8px;font-size:.85rem;color:var(--mu);margin-bottom:12px}
.stats b{color:var(--tx)}
#log{height:290px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.m{max-width:88%;padding:8px 12px;border-radius:14px;font-size:.95rem}
.a{background:var(--bg);border:1px solid var(--bd);align-self:flex-start}
.u{background:var(--ac);color:#fff;align-self:flex-end}
.ok{color:var(--ok)}.no{color:var(--no)}
.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;cursor:pointer}
button.main{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
#mic{width:84px;height:84px;border-radius:50%;font-size:2rem;padding:0}
#mic.on{animation:p 1s infinite;background:var(--no);border-color:var(--no)}
@keyframes p{50%{transform:scale(1.08)}}
form{display:flex;gap:8px;margin-top:10px}
input{flex:1;font:inherit;padding:9px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);min-width:0}
#st{text-align:center;color:var(--mu);font-size:.85rem;min-height:1.3em;margin:8px 0}
small{color:var(--mu)}
</style></head><body><main>
<h1>🎙️ Lexi, your vocabulary coach</h1>
<p class="sub">Lexi reads a definition out loud. You say the word. Say “hint”, “repeat” or “skip” anytime.</p>
<div class="stats"><span>Score <b id="sc">0</b></span><span>·</span><span>Streak <b id="sk">0</b></span><span>·</span><span>Left <b id="lf">0</b></span></div>
<div class="card"><div id="log" aria-live="polite"></div>
<form id="f"><input id="ti" placeholder="No mic? Type your answer here" autocomplete="off"><button class="main">Send</button></form></div>
<div id="st"></div>
<div class="row"><button id="mic" class="main" title="Tap to speak">🎤</button></div>
<div class="row" style="margin-top:12px"><button id="start" class="main">Start session</button><button id="rep">Repeat</button><button id="hint">Hint</button><button id="skip">Skip</button></div>
<p style="text-align:center"><small>Works best in Chrome or Edge. If the mic is blocked inside a preview, open this page in its own tab.</small></p>
</main>
<script>
const WORDS=[
{w:"ephemeral",d:"lasting for a very short time",e:"The beauty of a sunset is ephemeral."},
{w:"ubiquitous",d:"seeming to be present everywhere at the same time",e:"Smartphones are ubiquitous these days."},
{w:"pragmatic",d:"dealing with things in a practical, sensible way rather than with ideals",e:"She took a pragmatic approach and just fixed the bug."},
{w:"benevolent",d:"kind, generous and wanting to help others",e:"A benevolent donor paid for the school library."},
{w:"meticulous",d:"showing great attention to detail",e:"He was meticulous about checking every line of code."},
{w:"resilient",d:"able to recover quickly from difficulties",e:"Resilient people bounce back after failure."},
{w:"ambiguous",d:"open to more than one interpretation; not clear",e:"The contract wording was ambiguous."},
{w:"candid",d:"honest and straightforward, even when it is uncomfortable",e:"I appreciate your candid feedback."},
{w:"scrutinize",d:"to examine something very carefully and closely",e:"Auditors scrutinize every expense."},
{w:"eloquent",d:"able to speak or write fluently and persuasively",e:"Her eloquent speech moved the audience."}];
const $=id=>document.getElementById(id);
const log=$("log"),st=$("st");
let queue=[],cur=null,tries=0,score=0,streak=0,busy=false,hinted=0,rec=null,active=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function add(t,c){const d=document.createElement("div");d.className="m "+c;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight}
function stats(){$("sc").textContent=score;$("sk").textContent=streak;$("lf").textContent=queue.length+(cur?1:0)}
function speak(t){add(t,"a");return new Promise(r=>{try{const s=speechSynthesis;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.95;u.onend=u.onerror=()=>r();s.speak(u);setTimeout(r,Math.max(2500,t.length*90))}catch(e){r()}})}
function lev(a,b){const m=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length).fill(0)]);for(let j=0;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length]}
function norm(s){return s.toLowerCase().replace(/[^a-z\s]/g," ").split(/\s+/).filter(Boolean)}
function matches(alts,w){return alts.some(a=>norm(a).some(t=>t==w||(w.length>5&&lev(t,w)<=1)))}
function cmd(alts){const j=alts.join(" ").toLowerCase();if(/\b(skip|next|pass)\b/.test(j))return"skip";if(/\bhint\b/.test(j))return"hint";if(/\b(repeat|again|say that)\b/.test(j))return"rep";return null}
async function ask(){
  if(!queue.length){cur=null;stats();const t=score+" out of "+WORDS.length+" points. ";await speak("That’s the session. "+t+"Tap Start session to go again.");active=false;return}
  cur=queue.shift();tries=0;hinted=0;stats();
  await speak("Which word means: "+cur.d+"?");listen()}
async function handle(alts){
  if(!cur||busy)return;busy=true;const said=alts[0];add(said,"u");
  const c=cmd(alts);
  if(c=="skip"){await speak("Skipping. The word was "+cur.w+". "+cur.e);queue.push(cur);busy=false;streak=0;return ask()}
  if(c=="rep"){busy=false;await speak("Which word means: "+cur.d+"?");return listen()}
  if(c=="hint"){hinted++;const h=hinted==1?"It starts with “"+cur.w[0].toUpperCase()+"” and has "+cur.w.length+" letters.":"It starts with “"+cur.w.slice(0,3)+"”.";busy=false;await speak(h);return listen()}
  if(matches(alts,cur.w)){const pts=tries==0&&!hinted?1:0;score+=pts;streak++;
    await speak((pts?"Correct! ":"Got it, ")+cur.w+". Example: "+cur.e);busy=false;return ask()}
  tries++;streak=0;stats();
  if(tries>=2){await speak("Not quite. The answer is "+cur.w+". "+cur.e+" I’ll bring it back later.");queue.push(cur);busy=false;return ask()}
  busy=false;await speak("Close, but no. Try again, or say hint.");listen()}
function listen(){
  if(!SR){st.textContent="Speech recognition isn’t supported here. Type your answer instead.";return}
  try{if(rec)rec.abort()}catch(e){}
  rec=new SR();rec.lang="en-US";rec.maxAlternatives=5;rec.interimResults=false;
  rec.onstart=()=>{$("mic").classList.add("on");st.textContent="Listening…"};
  rec.onend=()=>{$("mic").classList.remove("on");if(st.textContent=="Listening…")st.textContent=""};
  rec.onerror=e=>{$("mic").classList.remove("on");st.textContent=e.error=="not-allowed"||e.error=="service-not-allowed"?"Mic blocked. Open this page in its own tab, or type your answer.":e.error=="no-speech"?"Didn’t catch anything. Tap the mic again.":"Mic error ("+e.error+"). You can type instead."};
  rec.onresult=e=>{const alts=[...e.results[0]].map(x=>x.transcript);handle(alts)};
  try{rec.start()}catch(e){}}
$("start").onclick=()=>{queue=[...WORDS].sort(()=>Math.random()-.5);score=0;streak=0;log.innerHTML="";active=true;busy=false;speak("Hey, I’m Lexi. I’ll read a definition and you say the word. Let’s go.").then(ask)};
$("mic").onclick=()=>{if(!active)return $("start").click();try{speechSynthesis.cancel()}catch(e){}listen()};
$("rep").onclick=()=>cur&&handle(["repeat"]);
$("hint").onclick=()=>cur&&handle(["hint"]);
$("skip").onclick=()=>cur&&handle(["skip"]);
$("f").onsubmit=e=>{e.preventDefault();const v=$("ti").value.trim();$("ti").value="";if(!v)return;if(!cur)return $("start").click();try{rec&&rec.abort()}catch(e){}handle([v])};
add("Tap “Start session” and Lexi will begin.","a");stats();
</script></body></html>
